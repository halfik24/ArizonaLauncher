[package]
name = "arizona-launcher"
version = "2.0.0-rc1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
dirs = "6"
base64 = "0.22"
encoding_rs = "0.8"
zip = "2"
regex = "1"
tempfile = "3"
winreg = "0.52"
sysinfo = "0.33"
open = "5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winver", "winuser", "windef", "minwindef", "dwmapi"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
