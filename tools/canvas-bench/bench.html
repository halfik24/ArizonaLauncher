<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>canvas-bench: backdrop-filter vs canvas2D vs WebGL</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:"Segoe UI",system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  .scene{position:absolute;inset:0;display:none}
  .scene.on{display:block}
  .scene > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas.scene{width:100%;height:100%}
  /* DOM-панель: frost как .settings-panel в лаунчере */
  .panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:rgba(16,18,26,.72);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;
    box-shadow:0 18px 60px rgba(0,0,0,.45);
    overflow:hidden;opacity:0;display:flex;flex-direction:column}
  #domScene .panel{backdrop-filter:blur(24px) saturate(1.2);
    -webkit-backdrop-filter:blur(24px) saturate(1.2)}
  #domScene.nb .panel{backdrop-filter:none;-webkit-backdrop-filter:none}
  .p-head{padding:18px 22px 12px;font-size:20px;font-weight:600;color:#eef1f7;
    display:flex;justify-content:space-between}
  .p-row{margin:8px 18px;padding:14px 16px;border-radius:10px;
    background:rgba(255,255,255,.05);display:flex;justify-content:space-between;
    align-items:center;color:#c9d2e3;font-size:15px}
  .p-sw{width:44px;height:22px;border-radius:11px;background:#3b82f6;position:relative}
  .p-sw::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;
    border-radius:50%;background:#fff}
  .p-sw.off{background:#5b6474}
  .p-sw.off::after{right:auto;left:3px}
  #hud{position:fixed;left:8px;top:4px;font:12px/1.4 Consolas,monospace;
    color:#9fb0cc;z-index:9;pointer-events:none;opacity:.8}
</style>
</head>
<body>
<div id="stage">
  <div class="scene on" id="domScene">
    <img id="bgImg" src="/wallpapers/6.jpeg" alt="">
    <div class="panel" id="domPanel">
      <div class="p-head"><span>Настройки</span><span>&#10005;</span></div>
      <div class="p-row"><span>Обои лаунчера</span><div class="p-sw"></div></div>
      <div class="p-row"><span>Проверять обновления</span><div class="p-sw"></div></div>
      <div class="p-row"><span>Свёрнутый режим</span><div class="p-sw off"></div></div>
      <div class="p-row"><span>Звук при запуске</span><div class="p-sw"></div></div>
    </div>
  </div>
  <canvas class="scene" id="cv2d"></canvas>
  <canvas class="scene" id="cvbaked"></canvas>
  <canvas class="scene" id="cvg"></canvas>
</div>
<div id="hud">init…</div>
<script src="bench.js"></script>
</body>
</html>
