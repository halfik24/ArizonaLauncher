name: build

# Сборка Tauri-лаунчера на GitHub-hosted раннере.
#
# Сборка гоняется на каждый push в рабочую ветку (контроль, что ничего не сломалось).
# Теги определяют режим:
#   v*          — релизная сборка: версия берётся из тега, публикуется GitHub Release
#                 с установщиком на вкладке Releases.
#   nightly-*   — ночная сборка: версия штампуется по времени раннера, результат
#                 живёт только артефактом во вкладке Actions (90 дней по умолчанию).

on:
  push:
    branches: [rust-rewrite, main]
    tags: ['v*', 'nightly-*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # Релизный тег (v2.0.0-beta.123) задаёт версию сборки: раньше версия
      # штамповалась по часам раннера и не была связана с тегом — баг-репорт
      # нельзя было сопоставить с релизом. Ночные теги оставляют штамп по времени.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node tools/set-version.js --set "$env:TAG_NAME"

      - name: Build Tauri (NSIS)
        run: npm run build

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # Сохраняем исходное имя NSIS (пробелы + версия со сборкой),
          # чтобы скачанный артефакт сразу показывал свою сборку.
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" |
                   Select-Object -First 1
          if (-not $setup) { throw "NSIS-установщик не найден" }
          Copy-Item $setup.FullName "out/$($setup.Name)"
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: out/*-setup.exe
          if-no-files-found: error

      # ── Публикация Release на стабильных тегах ─────────────────────────────
      # Тег v2.0.0-beta.N → GitHub Release с установщиком на странице Releases.
      # Ночные теги и пушы Release не создают — артефакт ждёт в Actions.
      # Обложку/описание релиза можно потом красиво отредактировать на GitHub.
      - name: Create GitHub Release (v tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $setup = Get-ChildItem "out/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS-установщик не найден" }
          $title = "Arizona RP Launcher $env:TAG_NAME"
          $notes = "Установщик ``$env:TAG_NAME``.`n`nТребования: Windows 10/11 x64, права администратора не нужны.`nУстановщик не имеет цифровой подписи — SmartScreen может предупреждать при первом запуске."
          $exists = gh release view "$env:TAG_NAME" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG_NAME" "$($setup.FullName)" --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create "$env:TAG_NAME" "$($setup.FullName)" --repo $env:GITHUB_REPOSITORY --title "$title" --notes "$notes"
          }
          if ($LASTEXITCODE -ne 0) { throw "не удалось создать/обновить Release" }
          Write-Host "Release $env:TAG_NAME опубликован с $($setup.Name)"
