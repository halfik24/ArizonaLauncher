<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona RP Launcher</title>
<link rel="stylesheet" href="styles.css">
<script src="tauri-bridge.js"></script>
<script src="lucide.min.js"></script>
</head>
<body>
<div id="app">
  <!-- ===== Header ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">A</span>
      <div class="brand-text">
        <strong>ARIZONA RP</strong>
        <small>Launcher v2.0</small>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="conn-dot" class="conn" title="Статус сети">●</span>
      <button class="icon-btn" id="btn-folder" title="Папка игры"><i data-lucide="folder-open"></i></button>
      <button class="icon-btn" id="btn-tg" title="Telegram"><i data-lucide="send"></i></button>
      <button class="icon-btn" id="btn-settings" title="Настройки"><i data-lucide="settings"></i></button>
      <button class="icon-btn" id="btn-min" title="Свернуть"><i data-lucide="minus"></i></button>
      <button class="icon-btn" id="btn-tray" title="Свернуть в трей"><i data-lucide="chevron-down"></i></button>
    </div>
  </header>

  <div class="layout">
    <!-- ===== Servers sidebar ===== -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Серверы</span>
        <button class="icon-btn sm" id="btn-refresh" title="Обновить"><i data-lucide="refresh-cw"></i></button>
      </div>
      <input id="server-search" class="search" type="text" placeholder="Поиск сервера…" autocomplete="off">
      <div id="server-list" class="server-list"><div class="empty">Загрузка…</div></div>
    </aside>

    <!-- ===== Main ===== -->
    <main class="main">
      <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-inner">
          <h1>ARIZONA <span>ROLE PLAY</span></h1>
          <p class="hero-sub">Выбери сервер слева, введи ник и жми играть</p>
          <div class="play-row">
            <input id="nickname" class="nick" type="text" placeholder="Твой ник" maxlength="20" autocomplete="off">
            <button id="btn-play" class="play-btn"><i data-lucide="play"></i><span>ИГРАТЬ</span></button>
          </div>
          <div id="server-card" class="server-card hidden"></div>
          <div id="play-status" class="status"></div>
        </div>
      </section>

      <div class="panels">
        <section class="panel">
          <div class="panel-head">
            <h2><i data-lucide="newspaper"></i>Новости</h2>
            <button class="icon-btn sm" id="btn-news" title="Обновить новости"><i data-lucide="refresh-cw"></i></button>
          </div>
          <div id="news" class="news">Загрузка…</div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2><i data-lucide="wrench"></i>Патчи</h2></div>
          <div id="patches" class="patches">Проверка…</div>
        </section>
      </div>
    </main>
  </div>

  <footer class="statusbar">
    <span id="sb-paths">Пути: …</span>
    <span id="sb-servers"></span>
    <span id="sb-mode"></span>
  </footer>
</div>

<!-- ===== Settings modal ===== -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Настройки</h2>
      <button class="icon-btn" id="btn-settings-close"><i data-lucide="x"></i></button>
    </div>
    <label>Путь к gta_sa.exe<input id="set-game" type="text" placeholder="C:\…\gta_sa.exe"></label>
    <label>Путь к лаунчеру игры<input id="set-launcher" type="text" placeholder="…\ArizonaLauncher8.0_byAIR.exe"></label>
    <div class="row">
      <button id="btn-autodetect" class="btn">Найти автоматически</button>
      <button id="btn-open-data" class="btn ghost">Папка данных</button>
    </div>
    <div class="grid2">
      <label>Память (МБ)<input id="set-memory" type="number" min="512" max="16384" step="256"></label>
      <label>CDN<input id="set-cdn" type="text" placeholder="1,1,1"></label>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="set-windowed"> Оконный режим</label>
      <label><input type="checkbox" id="set-autologin"> Автологин</label>
      <label><input type="checkbox" id="set-widescreen"> Widescreen</label>
      <label><input type="checkbox" id="set-grass"> Трава</label>
    </div>
    <div class="row end">
      <button id="btn-settings-save" class="btn primary">Сохранить</button>
    </div>
    <div id="settings-status" class="status"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<script src="app.js"></script>
</body>
</html>
